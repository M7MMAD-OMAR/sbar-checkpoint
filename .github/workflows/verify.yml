name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check public content and links
        run: python3 tools/check_public.py
      - name: Run isolated regression tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Run documented example
        run: python3 tools/demo.py
      - name: Build and verify portable package
        run: python3 tools/package.py --output dist
