<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">من الطلب إلى نتيجة معتمدة</title><desc id="desc">تحديد المتطلبات ثم التخطيط والتنفيذ والتحقق والاعتماد. يعيد الدليل الفاشل أو القديم العمل إلى التنفيذ والتحقق. يحفظ التوقف سجل التشغيل.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#718096" /></marker></defs>
<rect width="1200" height="550" rx="24" fill="#f6f8fc" />
<g font-family="Arial,Helvetica,sans-serif">
<text x="52" y="55" font-size="13" font-weight="700" letter-spacing="2" fill="#245ce3">SBAR CHECKPOINT</text>
<text x="1148" y="103" font-size="32" font-weight="700" fill="#142338" direction="rtl">من الطلب إلى نتيجة معتمدة</text>
<text x="1148" y="137" font-size="17" font-weight="400" fill="#526176" direction="rtl">نتائج صغيرة. فحوص مخططة. مراجعة جديدة. اعتماد واضح.</text>
<rect x="52" y="192" width="202" height="172" rx="14" fill="white" stroke="#cbd5e2" />
<text x="234.0" y="224" font-size="13" font-weight="700" fill="#245ce3" direction="rtl">01</text>
<text x="234.0" y="258" font-size="21" font-weight="700" fill="#142338" direction="rtl">المتطلبات</text>
<text x="234.0" y="289" font-size="15" font-weight="400" fill="#526176" direction="rtl">نتيجة مطلوبة</text>
<text x="234.0" y="313" font-size="15" font-weight="400" fill="#526176" direction="rtl">نطاق وتفويض</text>
<path d="M256 278 H268" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" />
<rect x="272" y="192" width="202" height="172" rx="14" fill="white" stroke="#cbd5e2" />
<text x="454.0" y="224" font-size="13" font-weight="700" fill="#245ce3" direction="rtl">02</text>
<text x="454.0" y="258" font-size="21" font-weight="700" fill="#142338" direction="rtl">التخطيط</text>
<text x="454.0" y="289" font-size="15" font-weight="400" fill="#526176" direction="rtl">اعتماد المراحل</text>
<text x="454.0" y="313" font-size="15" font-weight="400" fill="#526176" direction="rtl">فحوص وبوابات</text>
<path d="M476 278 H488" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" />
<rect x="492" y="192" width="202" height="172" rx="14" fill="white" stroke="#cbd5e2" />
<text x="674.0" y="224" font-size="13" font-weight="700" fill="#245ce3" direction="rtl">03</text>
<text x="674.0" y="258" font-size="21" font-weight="700" fill="#142338" direction="rtl">التنفيذ</text>
<text x="674.0" y="289" font-size="15" font-weight="400" fill="#526176" direction="rtl">مرحلة جاهزة واحدة</text>
<text x="674.0" y="313" font-size="15" font-weight="400" fill="#526176" direction="rtl">حفظ العمل الموجود</text>
<path d="M696 278 H708" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" />
<rect x="712" y="192" width="202" height="172" rx="14" fill="#245ce3" stroke="#245ce3" />
<text x="894.0" y="224" font-size="13" font-weight="700" fill="#dbe8ff" direction="rtl">04</text>
<text x="894.0" y="258" font-size="21" font-weight="700" fill="white" direction="rtl">التحقق</text>
<text x="894.0" y="289" font-size="15" font-weight="400" fill="#e1eaff" direction="rtl">تنفيذ الفحوص فعليًا</text>
<text x="894.0" y="313" font-size="15" font-weight="400" fill="#e1eaff" direction="rtl">مراجع بسياق جديد</text>
<path d="M916 278 H928" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" />
<rect x="932" y="192" width="202" height="172" rx="14" fill="white" stroke="#cbd5e2" />
<text x="1114.0" y="224" font-size="13" font-weight="700" fill="#245ce3" direction="rtl">05</text>
<text x="1114.0" y="258" font-size="21" font-weight="700" fill="#142338" direction="rtl">الاعتماد</text>
<text x="1114.0" y="289" font-size="15" font-weight="400" fill="#526176" direction="rtl">كل الأدلة حالية</text>
<text x="1114.0" y="313" font-size="15" font-weight="400" fill="#526176" direction="rtl">فتح المراحل التابعة</text>
<path d="M813 366 V420 H593 V367" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
<text x="775" y="409" font-size="14" font-weight="700" fill="#526176" direction="rtl">إصلاح أو تجديد الأدلة</text>
<path d="M52 465 H1148" stroke="#dbe2ec" />
<text x="620" y="502" font-size="16" font-weight="400" fill="#526176" direction="rtl">يحفظ التوقف والاستئناف الخطة والسجل والأدلة.</text>
<text x="1148" y="502" font-size="16" font-weight="700" fill="#245ce3" direction="rtl">الاعتماد المحلي لا يعني النشر.</text>
</g>
</svg>
