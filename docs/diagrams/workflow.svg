<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">From request to accepted outcome</title><desc id="desc">Contract, plan, implement, verify and accept. Failed or stale evidence returns to implementation and verification. Pause preserves the run.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs>
<rect width="1200" height="550" rx="24" fill="#f6f8fc"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="52" y="55" font-size="13" font-weight="700" letter-spacing="2" fill="#245ce3">SBAR CHECKPOINT</text>
<text x="52" y="103" font-size="32" font-weight="700" fill="#142338">From request to accepted outcome</text>
<text x="52" y="137" font-size="17" font-weight="400" fill="#526176">Small outcomes. Planned checks. Fresh review. Explicit acceptance.</text>
<rect x="52" y="192" width="202" height="172" rx="14" fill="white" stroke="#cbd5e2"/>
<text x="72" y="224" font-size="13" font-weight="700" fill="#245ce3">01</text>
<text x="72" y="258" font-size="21" font-weight="700" fill="#142338">Contract</text>
<text x="72" y="289" font-size="15" font-weight="400" fill="#526176">Requirements</text>
<text x="72" y="313" font-size="15" font-weight="400" fill="#526176">Scope and authority</text>
<path d="M256 278 H268" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="272" y="192" width="202" height="172" rx="14" fill="white" stroke="#cbd5e2"/>
<text x="292" y="224" font-size="13" font-weight="700" fill="#245ce3">02</text>
<text x="292" y="258" font-size="21" font-weight="700" fill="#142338">Plan</text>
<text x="292" y="289" font-size="15" font-weight="400" fill="#526176">Dependencies</text>
<text x="292" y="313" font-size="15" font-weight="400" fill="#526176">Checks and gates</text>
<path d="M476 278 H488" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="492" y="192" width="202" height="172" rx="14" fill="white" stroke="#cbd5e2"/>
<text x="512" y="224" font-size="13" font-weight="700" fill="#245ce3">03</text>
<text x="512" y="258" font-size="21" font-weight="700" fill="#142338">Implement</text>
<text x="512" y="289" font-size="15" font-weight="400" fill="#526176">One ready stage</text>
<text x="512" y="313" font-size="15" font-weight="400" fill="#526176">Preserve existing work</text>
<path d="M696 278 H708" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="712" y="192" width="202" height="172" rx="14" fill="#245ce3" stroke="#245ce3"/>
<text x="732" y="224" font-size="13" font-weight="700" fill="#dbe8ff">04</text>
<text x="732" y="258" font-size="21" font-weight="700" fill="white">Verify</text>
<text x="732" y="289" font-size="15" font-weight="400" fill="#e1eaff">Run real checks</text>
<text x="732" y="313" font-size="15" font-weight="400" fill="#e1eaff">Fresh reviewer</text>
<path d="M916 278 H928" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="932" y="192" width="202" height="172" rx="14" fill="white" stroke="#cbd5e2"/>
<text x="952" y="224" font-size="13" font-weight="700" fill="#245ce3">05</text>
<text x="952" y="258" font-size="21" font-weight="700" fill="#142338">Accept</text>
<text x="952" y="289" font-size="15" font-weight="400" fill="#526176">All gates current</text>
<text x="952" y="313" font-size="15" font-weight="400" fill="#526176">Unlock dependents</text>
<path d="M813 366 V420 H593 V367" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="623" y="409" font-size="14" font-weight="700" fill="#526176">Repair or refresh</text>
<path d="M52 465 H1148" stroke="#dbe2ec"/>
<text x="52" y="502" font-size="16" font-weight="400" fill="#526176">Pause / resume preserves the plan, journal and evidence.</text>
<text x="697" y="502" font-size="16" font-weight="700" fill="#245ce3">Accepted locally does not mean deployed.</text>
</g>
</svg>
