<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 642" role="img" aria-labelledby="title desc">
<title id="title">Evidence belongs to a specific version</title><desc id="desc">Plan, source and artifact identities bind behavior, review and UI reports. Source or artifact changes invalidate proof. Actor labels are not authentication.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#718096"/></marker></defs>
<rect width="1200" height="642" rx="24" fill="#f6f8fc"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="52" y="55" font-size="13" font-weight="700" letter-spacing="2" fill="#245ce3">SBAR CHECKPOINT</text>
<text x="52" y="103" font-size="32" font-weight="700" fill="#142338">Evidence belongs to a specific version</text>
<text x="52" y="137" font-size="17" font-weight="400" fill="#526176">A passing result is useful only while its inputs remain current.</text>
<rect x="52" y="184" width="354" height="126" rx="14" fill="white" stroke="#cbd5e2"/>
<text x="72" y="220" font-size="21" font-weight="700" fill="#142338">Plan identity</text>
<text x="72" y="251" font-size="15" font-weight="400" fill="#526176">Requirements, scopes</text>
<text x="72" y="275" font-size="15" font-weight="400" fill="#526176">Gate configuration</text>
<rect x="423" y="184" width="354" height="126" rx="14" fill="white" stroke="#cbd5e2"/>
<text x="443" y="220" font-size="21" font-weight="700" fill="#142338">Source identity</text>
<text x="443" y="251" font-size="15" font-weight="400" fill="#526176">Declared files and tests</text>
<text x="443" y="275" font-size="15" font-weight="400" fill="#526176">Ancestor scopes</text>
<rect x="794" y="184" width="354" height="126" rx="14" fill="white" stroke="#cbd5e2"/>
<text x="814" y="220" font-size="21" font-weight="700" fill="#142338">Artifact identity</text>
<text x="814" y="251" font-size="15" font-weight="400" fill="#526176">Captured logs and reports</text>
<text x="814" y="275" font-size="15" font-weight="400" fill="#526176">Reference and UI captures</text>
<path d="M229 312 V338 H600 V355" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 312 V338 H600 V355" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M971 312 V338 H600 V355" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="352" y="357" width="496" height="111" rx="14" fill="#245ce3" stroke="#245ce3"/>
<text x="372" y="393" font-size="21" font-weight="700" fill="white">Proof gate</text>
<text x="372" y="424" font-size="15" font-weight="400" fill="#e1eaff">Behavior passes. Independent review is current.</text>
<text x="372" y="448" font-size="15" font-weight="400" fill="#e1eaff">Required UI evidence matches. Findings are resolved.</text>
<path d="M600 470 V490" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="520" font-size="22" font-weight="700" fill="#142338">Accept the checkpoint</text>
<path d="M52 555 H1148" stroke="#dbe2ec"/>
<text x="52" y="589" font-size="16" font-weight="700" fill="#245ce3">Changed inputs: refresh affected checks and reviews.</text>
<text x="52" y="615" font-size="15" font-weight="400" fill="#526176">Hashes check consistency. Reviewer identity and permissions remain host responsibilities.</text>
</g>
</svg>
